name: Release

# T6.1 (issue #23): the "cargo-dist or equivalent" packaging pipeline.
# Triggered by pushing a `v*.*.*` tag (or manually via workflow_dispatch,
# for a dry run that builds everything but skips creating a GitHub
# Release). Publishes:
#   - macOS tarballs (aarch64-apple-darwin, x86_64-apple-darwin)
#   - Linux tarballs (x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu)
#     and a .deb for each (via cargo-deb)
#   - a SHA256SUMS file covering every published asset
#   - serialwrap.rb, a Homebrew formula pointing at the tarballs above
#     (rendered by packaging/homebrew/render-formula.sh)
#
# `install.sh` (repo root) and the rendered Homebrew formula download the
# tarballs by exactly the name built here
# (`serialwrap-<tag>-<target-triple>.tar.gz`) - if that naming ever
# changes, update all three places together.
#
# Linux builds run on ubuntu-22.04 (glibc 2.35), not ubuntu-latest: a
# binary links against the build host's glibc and refuses to start on an
# older one, and 22.04 is still a common firmware-bench host.
#
# The one failure mode this workflow exists specifically to prevent: a
# release binary whose embedded web GUI is `crates/serialwrapd/build.rs`'s
# placeholder page because `npm run build` never ran before `cargo build
# --release` on a release runner (see that file's own doc comment - this
# is called out there as "the easiest mistake to make and the hardest to
# notice"). Every build job below runs the frontend build first, and the
# `verify frontend is embedded, not the placeholder` step fails the whole
# job outright if it isn't.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

env:
  NODE_VERSION: "22"

jobs:
  # A tag that doesn't match the workspace version would publish binaries
  # whose `--version` contradicts the release they came from.
  check-version:
    name: Tag matches Cargo version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag and workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version v${version} in Cargo.toml" >&2
            exit 1
          fi

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json

      # Must run before any cargo build - see this workflow's own header
      # comment on why an embedded-placeholder release binary is exactly
      # the failure this ordering prevents.
      - name: Build web frontend
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Verify frontend is embedded, not the placeholder
        run: |
          if grep -q "serialwrap-build-rs-placeholder" webui/dist/index.html; then
            echo "::error::webui/dist/index.html is still build.rs's placeholder after npm run build - refusing to release a binary with a placeholder GUI" >&2
            exit 1
          fi

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }} -p serialwrap

      # The x86_64 build is cross-compiled on an arm64 runner, so only the
      # native one can be executed here.
      - name: Smoke-test the binary
        if: matrix.target == 'aarch64-apple-darwin'
        run: target/${{ matrix.target }}/release/serialwrap --version

      - name: Package tarball
        run: |
          # A dry run from a branch like docs/x would otherwise put a "/"
          # in the file name and package into a subdirectory.
          tag=$(printf '%s' "${GITHUB_REF_NAME:-dev}" | tr '/' '-')
          name="serialwrap-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/serialwrap" "dist/${name}/serialwrap"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          # Checksum from inside dist/ so SHA256SUMS lists bare file names
          # and `sha256sum -c SHA256SUMS` works in a download directory.
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build web frontend
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Verify frontend is embedded, not the placeholder
        run: |
          if grep -q "serialwrap-build-rs-placeholder" webui/dist/index.html; then
            echo "::error::webui/dist/index.html is still build.rs's placeholder after npm run build - refusing to release a binary with a placeholder GUI" >&2
            exit 1
          fi

      # Native build on each runner (x86_64 and arm64), so the binary lands
      # in target/release/, which is where cargo-deb's asset list expects it.
      - name: cargo build --release
        run: cargo build --release -p serialwrap

      - name: Smoke-test the binary
        run: target/release/serialwrap --version

      - name: Package tarball
        run: |
          # A dry run from a branch like docs/x would otherwise put a "/"
          # in the file name and package into a subdirectory.
          tag=$(printf '%s' "${GITHUB_REF_NAME:-dev}" | tr '/' '-')
          name="serialwrap-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/release/serialwrap "dist/${name}/serialwrap"
          cp README.md LICENSE packaging/linux/60-serialwrap.rules "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # `--no-build` (cargo-deb skips its own internal `cargo build
      # --release`) because the release binary above was already built with
      # the real frontend embedded - letting cargo-deb rebuild would just
      # repeat that work to produce the same binary.
      - name: Build .deb
        run: cargo deb -p serialwrap --no-build --output dist/

      - name: sha256sum the .deb
        working-directory: dist
        run: |
          for f in *.deb; do
            sha256sum "$f" > "${f}.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [check-version, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Render Homebrew formula
        run: packaging/homebrew/render-formula.sh "${GITHUB_REF_NAME}" dist/SHA256SUMS > dist/serialwrap.rb

      # A tag with a pre-release suffix (v0.2.0-beta.1) is published as a
      # GitHub pre-release, so `releases/latest` (what install.sh follows)
      # keeps pointing at the last stable one.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.deb dist/SHA256SUMS dist/serialwrap.rb \
            --title "serialwrap ${GITHUB_REF_NAME}" \
            --generate-notes ${prerelease}
